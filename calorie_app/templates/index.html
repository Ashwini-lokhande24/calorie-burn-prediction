<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Burn Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #e8521a;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            margin-bottom: 24px;
        }
        label {
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #e8521a;
        }

        button {
            padding: 12px;
            margin-top: 24px;
            background-color: #e8521a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #cc4414;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            background: #fff1ec;
            border-left: 4px solid #e8521a;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #333;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Calorie Burn Predictor</h1>
        <p>Enter your details to predict calories burned</p>

        <form action="/predict" method="POST">

            <!-- Gender -->
            <label>Gender</label>
            <select name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <!-- Age -->
            <label>Age</label>
            <input type="number" name="age" placeholder="Enter your age">

            <!-- Height -->
            <label>Height (cm)</label>
            <input type="number" name="height" placeholder="e.g. 165">

            <!-- Weight -->
            <label>Weight (kg)</label>
            <input type="number" name="weight" placeholder="e.g. 65">

            <!-- Duration(minutes) -->
            <label>Duration(minutes)</label>
            <input type="number" name="duration" placeholder="e.g. 10">

            <!-- Heart Rate(bpm) -->
            <label>Heart Rate(bpm)</label>
            <input type="number" name="heart_rate" placeholder="e.g. 40">

            <!-- Body Temperature -->
            <label>Body Temperature(°C)</label>
            <input type="number" name="body_temp" placeholder="e.g. 30">

            <!--Submit button-->
            <button type="submit"> Predict Calories →</button>

            <!--inserting python values in html-->
            {% if prediction %}
            <div class="result">
                🔥 Predicted Calories Burned: <strong>{{ prediction }} kcal</strong>
            </div>
            {% endif %}
        </form>
    </div>
</body>
</html>
